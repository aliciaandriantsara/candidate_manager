name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
        continue-on-error: true
      - run: npm run test:coverage
        working-directory: backend
      - name: Check backend coverage threshold
        run: |
          COVERAGE=$(node -e "const s=require('./coverage/coverage-summary.json');const t=s.total;console.log(t.lines.pct)")
          echo "Backend coverage: $COVERAGE%"
          node -e "const t=require('./coverage/coverage-summary.json').total; if(t.lines.pct<90) process.exit(1)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - name: Check frontend hooks/utils coverage
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total; if(t.lines.pct<90) process.exit(1)"

  merge-gate:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"
