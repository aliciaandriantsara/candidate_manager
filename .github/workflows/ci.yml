name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"                          # ✅ Node 22 LTS, évite le warning
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend
        continue-on-error: true

      - name: Tests with coverage
        run: npm run test:coverage
        working-directory: backend
        continue-on-error: true

      - name: Check coverage threshold (90%)
        working-directory: backend
        continue-on-error: true
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            if (t.lines.pct < 90) {
              console.error('Coverage ' + t.lines.pct + '% < 90%');
              process.exit(1);
            }
            console.log('Coverage OK: ' + t.lines.pct + '%');
          "

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"                          # ✅ Node 22 LTS
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers                # ✅ Étape manquante
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Run Playwright e2e tests                   # ✅ Étape manquante
        run: npx playwright test
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173     # port de `vite preview`

      - name: Upload Playwright report                   # ✅ Pratique pour debug
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
